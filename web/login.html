<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Drafty - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>Drafty</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="competiciones.html">Competiciones</a></li>
                <li><a href="mis-competiciones.html">Mis Competiciones</a></li>
            </ul>
        </nav>
        <div class="user-menu">
            <button class="btn-crear">+ Crear Competición</button>
            <div class="perfil-icon">
                <img src="https://via.placeholder.com/40" alt="Usuario anónimo">
            </div>
        </div>
    </header>

    <main class="main-login">
        <div class="caja-login">
            <h2>INICIAR SESIÓN</h2>
            
            <form method="post" action="#">
                <div class="grupo-input">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej: Samuel_SJ" required autocomplete="off">
                </div>

                <div class="grupo-input">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="********" required>
                </div>

                <div class="grupo-botones">
                    <input type="submit" class="btn-entrar" value="Entrar">
                </div>
            </form>

            <div class="enlace-registro">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            </div>
        </div>
    </main>
</body>
</html>
