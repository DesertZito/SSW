<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drafty - Inicio Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="logo.svg" alt="Logo Drafty" class="img-logo">
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="competiciones.html">Competiciones</a></li>
                <li><a href="mis_competiciones.html">Mis Competiciones</a></li>
                <li><a href="crear_competicion.html" class="btn-crear">+ Crear Competición</a></li>
                <li>
                    <a href="#" class="icono-perfil" aria-label="Perfil">
                        <img src="perfil.svg" alt="Perfil" class="img-perfil">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="iniciar-sesion">
            <h2>INICIAR SESIÓN</h2>
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="username">Usuario/correo electrónico</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
            <div class="debajo-formulario">
                <a href="registro.html">¿No tienes cuenta? Regístrate</a>
            </div>
        </div>
    </main>

</body>
</html>
