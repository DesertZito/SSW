<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drafty - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="logo.svg" alt="Logo Drafty" class="img-logo">
        </div>
        <nav>
            <ul>
                <li><a href="inicio.html">Inicio</a></li>
                <li><a href="competiciones.html">Competiciones</a></li>
                <li><a href="mis_competiciones.html">Mis Competiciones</a></li>
                <li><a href="crear_competicion.html" class="btn-crear">+ Crear Competición</a></li>
                <li>
                    <a href="#" class="icono-perfil" aria-label="Perfil">
                        <img src="perfil.svg" alt="Perfil" class="img-perfil">
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="iniciar-sesion">
            <h2>REGISTRASE  </h2>
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="nuevo_usuario">Usuario</label>
                    <input type="text" id="nuevo_usuario" name="nuevo_usuario" placeholder="Ej: Samuel_SJ" required>
                </div>

                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Ej: samuel@uva.es" required>
                </div>
                <div class="grupo-input">
                    <label for="nueva_contrasena">Contraseña</label>
                    <input type="password" id="nueva_contrasena" name="nueva_contrasena" placeholder="Mínimo 8 caracteres" required>
                </div>



                <button type="submit" class="btn-entrar">Registrar</button>
            </form>
            <div class="debajo-formulario">
                <a href="index.html">¿Ya tienes cuenta? Inicia Sesión</a>
            </div>
        </div>
    </main>
</body>
</html>
